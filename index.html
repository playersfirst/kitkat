<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title><3</title>
<style>
:root{--bg:#355E3B;--fg:#e6f2e4;--dim:#a9c9ae;--pink:#355E3B;--cream:#f4f1e8;--ink:#355E3B;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Courier New",ui-monospace,monospace;transition:background .8s,color .8s;overflow:hidden}
#term{padding:24px;font-size:15px;line-height:1.7;max-width:520px;margin:0 auto}
#term div{opacity:0;animation:in .01s forwards}
.dim{color:var(--dim)}
@keyframes in{to{opacity:1}}
#reveal{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
background:var(--cream);color:var(--ink);opacity:0;pointer-events:none;transition:opacity .9s;text-align:center;padding:24px;
font-family:Georgia,"Times New Roman",serif}
#reveal.on{opacity:1;pointer-events:auto}
#reveal h1{font-size:clamp(56px,16vw,120px);margin:0;font-weight:700;font-style:italic;color:var(--pink);letter-spacing:-.02em;cursor:pointer;user-select:none;-webkit-user-select:none;white-space:nowrap;transition:transform .25s cubic-bezier(.34,1.56,.64,1);-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<div id="term"></div>
<div id="reveal">
  <h1>u cute</h1>
</div>
<script>
var lines=[
 ["> initializing hack...",0],
 ["> bypassing firewall.......... ok",800],
 ["> download complete.",1500]
];
var term=document.getElementById("term");
lines.forEach(function(l){
  setTimeout(function(){
    var d=document.createElement("div");
    d.textContent=l[0]; if(l[2]) d.className=l[2];
    term.appendChild(d);
  },l[1]);
});
setTimeout(function(){
  document.body.style.background="#f4f1e8";
  document.getElementById("reveal").className="on";
},2200);
var s=1,big=document.querySelector("#reveal h1");
big.addEventListener("click",function(){s*=1.25;big.style.transform="scale("+s+")";});
</script>
</body>
</html>
